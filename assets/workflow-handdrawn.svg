<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Research Summarizer workflow</title>
  <desc id="desc">Hand-drawn workflow showing request, deterministic dispatch, evidence collection, optional Jev source selection for searches, one synthesis LLM call, and SummaryResult.</desc>

  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#262626"/>
    </marker>
    <style>
      .paper { fill: #fbf7ed; }
      .ink { fill: none; stroke: #262626; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .soft { fill: #fffdf7; stroke: #262626; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #eef3df; stroke: #262626; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .accent2 { fill: #e9eff7; stroke: #262626; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .accent3 { fill: #f8e9de; stroke: #262626; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .title { font: 700 34px "Comic Sans MS", "Bradley Hand", cursive; fill: #202020; }
      .label { font: 700 24px "Comic Sans MS", "Bradley Hand", cursive; fill: #202020; }
      .small { font: 19px "Comic Sans MS", "Bradley Hand", cursive; fill: #333; }
      .tiny { font: 17px "Comic Sans MS", "Bradley Hand", cursive; fill: #444; }
      .note { font: italic 18px "Comic Sans MS", "Bradley Hand", cursive; fill: #5a5248; }
      .dash { stroke-dasharray: 9 10; }
    </style>
  </defs>

  <rect class="paper" width="1400" height="760" rx="28"/>

  <g filter="url(#rough)">
    <path class="ink" d="M88 94 C292 71, 540 74, 734 88 C931 100, 1125 83, 1312 96" opacity="0.22"/>
    <text x="700" y="72" text-anchor="middle" class="title">rs · research workflow</text>

    <!-- main nodes -->
    <rect x="55" y="196" width="170" height="104" rx="20" class="soft"/>
    <text x="140" y="238" text-anchor="middle" class="label">request</text>
    <text x="140" y="270" text-anchor="middle" class="small">topic / URL / file</text>

    <rect x="278" y="196" width="190" height="104" rx="20" class="accent2"/>
    <text x="373" y="238" text-anchor="middle" class="label">dispatch</text>
    <text x="373" y="270" text-anchor="middle" class="small">deterministic</text>

    <rect x="526" y="196" width="210" height="104" rx="20" class="accent"/>
    <text x="631" y="238" text-anchor="middle" class="label">evidence</text>
    <text x="631" y="270" text-anchor="middle" class="small">fetch / read / search</text>

    <rect x="810" y="196" width="204" height="104" rx="20" class="accent3"/>
    <text x="912" y="236" text-anchor="middle" class="label">Jev select</text>
    <text x="912" y="268" text-anchor="middle" class="small">search only · top 3</text>

    <rect x="1081" y="196" width="188" height="104" rx="20" class="accent2"/>
    <text x="1175" y="236" text-anchor="middle" class="label">LLM</text>
    <text x="1175" y="268" text-anchor="middle" class="small">one synthesis call</text>

    <rect x="1110" y="420" width="230" height="126" rx="22" class="soft"/>
    <text x="1225" y="460" text-anchor="middle" class="label">SummaryResult</text>
    <text x="1225" y="492" text-anchor="middle" class="tiny">summary · details</text>
    <text x="1225" y="519" text-anchor="middle" class="tiny">sources · caveats</text>

    <!-- arrows -->
    <path class="ink" marker-end="url(#arrow)" d="M225 248 C243 246, 258 246, 278 248"/>
    <path class="ink" marker-end="url(#arrow)" d="M468 248 C489 246, 504 246, 526 248"/>
    <path class="ink" marker-end="url(#arrow)" d="M736 248 C765 246, 784 246, 810 248"/>
    <path class="ink" marker-end="url(#arrow)" d="M1014 248 C1038 247, 1055 247, 1081 248"/>
    <path class="ink" marker-end="url(#arrow)" d="M1175 300 C1178 342, 1203 373, 1218 420"/>

    <!-- skip Jev for URL/file -->
    <path class="ink dash" marker-end="url(#arrow)" d="M632 301 C666 362, 773 388, 914 383 C1034 379, 1107 343, 1143 301" opacity="0.7"/>
    <text x="892" y="414" text-anchor="middle" class="note">URL + local file skip Jev</text>

    <!-- routing notes -->
    <path class="ink" d="M353 304 C333 361, 303 394, 277 435" opacity="0.5"/>
    <path class="ink" d="M376 304 C385 361, 386 394, 386 435" opacity="0.5"/>
    <path class="ink" d="M398 304 C433 356, 469 391, 502 435" opacity="0.5"/>

    <rect x="183" y="435" width="190" height="84" rx="18" class="soft"/>
    <text x="278" y="469" text-anchor="middle" class="small">URL</text>
    <text x="278" y="496" text-anchor="middle" class="tiny">fetch page</text>

    <rect x="401" y="435" width="190" height="84" rx="18" class="soft"/>
    <text x="496" y="469" text-anchor="middle" class="small">.txt / .md</text>
    <text x="496" y="496" text-anchor="middle" class="tiny">read local file</text>

    <rect x="619" y="435" width="210" height="84" rx="18" class="soft"/>
    <text x="724" y="469" text-anchor="middle" class="small">anything else</text>
    <text x="724" y="496" text-anchor="middle" class="tiny">Tavily search</text>

    <path class="ink" d="M403 307 C468 381, 564 403, 704 435" opacity="0.5"/>

    <!-- notes -->
    <path class="ink" d="M70 624 C310 604, 510 616, 714 629 C914 642, 1109 622, 1329 634" opacity="0.2"/>
    <text x="78" y="679" class="note">no planner · no replanner · no LLM routing</text>
    <text x="78" y="711" class="note">evidence in → structured, cited summary out</text>

    <!-- little hand-drawn stars -->
    <path class="ink" d="M1305 124 l7 15 16 3 -14 9 2 17 -12 -12 -16 7 7 -16 -11 -12 17 2z" opacity="0.55"/>
    <path class="ink" d="M101 118 l4 9 10 2 -9 5 2 10 -8 -7 -9 4 4 -9 -7 -7 10 1z" opacity="0.45"/>
  </g>
</svg>